name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/affectionate-bell-ou8wo4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (base href = nom du repo)
        run: npx ng build --configuration production --base-href "/${GITHUB_REPOSITORY#*/}/"
      - name: Publish to gh-pages branch
        run: |
          cd dist/nouveauportfolio
          touch .nojekyll
          cp index.html 404.html
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
