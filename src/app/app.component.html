@switch (theme.current()) {
  @case ("vista-desktop") {
    @defer (on immediate) {
      <app-vista-desktop />
    } @placeholder {
      <div class="mw-loading" role="status">Chargement…</div>
    }
  }
  @case ("aero-horizon") {
    @defer (on immediate) {
      <app-aero-horizon />
    } @placeholder {
      <div class="mw-loading" role="status">Chargement…</div>
    }
  }
  @case ("aero-cinema") {
    @defer (on immediate) {
      <app-aero-cinema />
    } @placeholder {
      <div class="mw-loading" role="status">Chargement…</div>
    }
  }
  @default {
    <app-classic-theme />
  }
}
<app-admin />
